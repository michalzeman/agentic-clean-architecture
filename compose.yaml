services:
  redis-db:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    volumes:
      - redis-db-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redisinsight:
    image: 'redis/redisinsight:latest'
    ports:
      - '5540:5540'
    depends_on:
      - redis-db
    environment:
      - REDIS_HOSTS=redis-db:6379
    volumes:
      - redisinsight-data:/data

  postgres-db:
    image: 'postgres:16-alpine'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_pass
    volumes:
      - postgres-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  nats-db:
    image: 'nats:2.10.7-alpine'
    command: ["-c", "/etc/nats/nats-jetstream.conf", "-m", "8222"]
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - ./nats-jetstream.conf:/etc/nats/nats-jetstream.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bank-account-service:
    image: 'bank-account:latest'
    container_name: bank-account-service
    build:
      context: .
      dockerfile: bank-account/bank-account-boot-app/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      redis-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      nats-db:
        condition: service_healthy
    environment:
      - REDIS_DB=redis-db
      - POSTGRES_DB=postgres-db
      - POSTGRES_USER=bank_user
      - POSTGRES_PASSWORD=bank_pass
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE_GROUP:-postgres-nats}
      - NATS_JETSTREAM_ENABLED=${NATS_JETSTREAM_ENABLED:-true}
      - NATS_URL=nats://nats-db:4222
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    profiles:
      - system-tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  bank-transaction-service:
    image: 'bank-transaction:latest'
    container_name: bank-transaction-service
    build:
      context: .
      dockerfile: bank-transaction/bank-transaction-boot-app/Dockerfile
    ports:
      - '8081:8081'
    depends_on:
      redis-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      nats-db:
        condition: service_healthy
      bank-account-service:
        condition: service_healthy
    environment:
      - REDIS_DB=redis-db
      - POSTGRES_DB=postgres-db
      - POSTGRES_USER=bank_user
      - POSTGRES_PASSWORD=bank_pass
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE_GROUP:-postgres-nats}
      - NATS_JETSTREAM_ENABLED=${NATS_JETSTREAM_ENABLED:-true}
      - NATS_URL=nats://nats-db:4222
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    profiles:
      - system-tests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  prometheus:
    image: 'prom/prometheus:v3.5.0'
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: 'grafana/grafana:12.0.0'
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  redis-exporter:
    image: 'oliver006/redis_exporter:v1.5.2'
    container_name: redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis-db:6379
    depends_on:
      - redis-db

  postgres-exporter:
    image: 'prometheuscommunity/postgres-exporter:v0.17.1'
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://bank_user:bank_pass@postgres-db:5432/bank_db?sslmode=disable
    depends_on:
      - postgres-db

  nats-exporter:
    image: 'natsio/prometheus-nats-exporter:0.14.0'
    container_name: nats-exporter
    # -jsz takes an optional JetStream account filter; "" means all accounts.
    # Without this empty arg, the flag parser consumes the next flag as the filter value.
    command: ["-varz", "-jsz", "", "-connz", "-routez", "-subz", "http://nats-db:8222"]
    ports:
      - "7777:7777"
    depends_on:
      - nats-db

  loki:
    image: 'grafana/loki:3.5.1'
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O- http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tempo:
    image: 'grafana/tempo:2.7.0'
    container_name: tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- -T 3 http://localhost:3200/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  alloy:
    image: 'grafana/alloy:v1.10.0'
    container_name: alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - loki

volumes:
  redis-db-data:
  redisinsight-data:
  postgres-db-data:
  loki-data:
  tempo-data:
